[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-aleth"
version = "1.1.0"
description = "Aleth — OpenEnv scientific citation verification benchmark"
requires-python = ">=3.10"
dependencies = [
    # OpenEnv core (required for multi-mode deployment validation)
    "openenv-core[core]>=0.2.2",
    # FastAPI server
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    # LLM inference
    "openai>=1.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.5.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
include-package-data = true
packages = ["aleth"]
package-dir = { "aleth" = "." }
